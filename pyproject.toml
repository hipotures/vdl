[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vdl"
version = "0.1.0"
description = "Recurring yt-dlp downloads with a Rich terminal and mobile web interface"
readme = "README.md"
requires-python = ">=3.12"
license = "CC0-1.0"
dependencies = [
    "aiohttp>=3.13,<4",
    "prompt-toolkit>=3.0.52,<4",
    "rich>=14,<16",
]

[project.scripts]
vdl = "vdl.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]
browser = ["playwright>=1.57,<2"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/vdl"]
