[package]
name = "vdl"
version = "0.2.0"
edition = "2024"
license = "CC0-1.0"
description = "Recurring yt-dlp downloads with a terminal and mobile web interface"

[[bin]]
name = "vdl"
path = "src/main.rs"

[dependencies]
axum = "0.8"
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
trycmd = "0.15"
